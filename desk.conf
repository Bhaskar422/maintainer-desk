# Maintainer Desk rules. Every value can be overridden by an environment
# variable of the same name, e.g. `TARGET_REPO=me/repo desk sweep`.

# The repository the desk runs (owner/name).
TARGET_REPO="${TARGET_REPO:-}"

# Only issues with this label can be claimed. Empty = any open issue.
CLAIM_LABEL="${CLAIM_LABEL-hackathon}"

# Most open pull requests one contributor may have in the repo at once. 0 = no cap.
PR_CAP="${PR_CAP:-5}"

# Most open issues one contributor may hold at once. 0 = no cap.
ASSIGN_CAP="${ASSIGN_CAP:-5}"

# Hours without activity before an assignment is flagged as stale.
IDLE_HOURS="${IDLE_HOURS:-48}"

# A pull request touching this many changed lines or fewer is flagged as trivial.
TRIVIAL_LINES="${TRIVIAL_LINES:-3}"

# 1 = print every GitHub change instead of making it.
DRY_RUN="${DRY_RUN:-0}"

# Where every agent on this machine appends its actions (used by `desk metrics`).
DESK_LOG="${DESK_LOG:-$HOME/.maintainer-desk/desk-log.jsonl}"
